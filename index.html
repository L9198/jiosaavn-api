<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Music</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #121212; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    #searchView { display: flex; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 90px; }
    header { padding: 16px; position: sticky; top: 0; background: #121212; z-index: 10; }
    .header-title { font-size: 22px; font-weight: 700; color: #1db954; margin-bottom: 12px; }
    .search-box { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px 16px; border-radius: 25px; border: none; background: #242424; color: #fff; font-size: 15px; outline: none; }
    .search-box button { padding: 0 20px; border-radius: 25px; border: none; background: #1db954; color: #000; font-weight: 700; cursor: pointer; }
    .song-list { padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; }
    .song-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer; }
    .song-item:active { background: #222; }
    .song-item img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .song-details { flex: 1; overflow: hidden; }
    .song-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 13px; color: #b3b3b3; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-info { text-align: center; color: #888; margin-top: 50px; font-size: 14px; }

    #miniPlayer { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: #282828; display: none; align-items: center; padding: 0 16px; border-top: 1px solid #333; cursor: pointer; z-index: 20; }
    #miniThumb { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; }
    .mini-info { flex: 1; margin: 0 12px; overflow: hidden; }
    .mini-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-btn { font-size: 20px; color: #fff; background: none; border: none; padding: 10px; cursor: pointer; }

    #fullPlayer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #3d2433 0%, #121212 100%); z-index: 50; display: none; flex-direction: column; justify-content: space-between; padding: 24px 20px 30px; }
    .fp-header { display: flex; justify-content: space-between; align-items: center; }
    .fp-header button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .fp-header span { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #ccc; font-weight: 600; }
    .fp-cover-box { width: 100%; display: flex; justify-content: center; align-items: center; margin: 20px 0; }
    .fp-cover { width: 85vw; height: 85vw; max-width: 330px; max-height: 330px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); object-fit: cover; }
    .fp-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .fp-text { flex: 1; overflow: hidden; padding-right: 15px; }
    .fp-title { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fp-artist { font-size: 14px; color: #b3b3b3; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fp-heart { font-size: 22px; color: #1db954; cursor: pointer; }

    .progress-container { width: 100%; }
    .progress-bar { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #4f4f4f; outline: none; }
    .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; }
    .time-stamps { display: flex; justify-content: space-between; font-size: 12px; color: #b3b3b3; margin-top: 6px; }

    .fp-controls { display: flex; justify-content: space-between; align-items: center; margin: 15px 0 10px; }
    .fp-controls button { background: none; border: none; color: #b3b3b3; font-size: 20px; cursor: pointer; }
    .fp-controls button.active { color: #1db954; }
    .play-btn-circle { width: 64px; height: 64px; border-radius: 50%; background: #fff !important; color: #000 !important; display: flex; align-items: center; justify-content: center; font-size: 24px !important; }
  </style>
</head>
<body>

  <div id="searchView">
    <header>
      <div class="header-title"><i class="fab fa-spotify"></i> Spotify Player</div>
      <div class="search-box">
        <input type="text" id="query" placeholder="Search songs, artists...">
        <button onclick="searchMusic()"><i class="fas fa-search"></i></button>
      </div>
    </header>
    <div id="results" class="song-list">
      <p class="status-info">Gaane ka naam search karke play karein</p>
    </div>
  </div>

  <div id="miniPlayer" onclick="openFullPlayer()">
    <img id="miniThumb" src="" alt="">
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">Title</div>
      <div class="mini-artist" id="miniArtist">Artist</div>
    </div>
    <button class="mini-btn" onclick="togglePlay(event)"><i id="miniPlayIcon" class="fas fa-play"></i></button>
  </div>

  <div id="fullPlayer">
    <div class="fp-header">
      <button onclick="closeFullPlayer()"><i class="fas fa-chevron-down"></i></button>
      <span>Playing from Search</span>
      <button><i class="fas fa-ellipsis-v"></i></button>
    </div>

    <div class="fp-cover-box">
      <img id="fpImg" class="fp-cover" src="" alt="Album Cover">
    </div>

    <div>
      <div class="fp-meta">
        <div class="fp-text">
          <div class="fp-title" id="fpTitle">Song Title</div>
          <div class="fp-artist" id="fpArtist">Artist Name</div>
        </div>
        <i class="far fa-heart fp-heart"></i>
      </div>

      <div class="progress-container">
        <input type="range" id="seekSlider" class="progress-bar" value="0" min="0" max="100" onchange="seekAudio()">
        <div class="time-stamps">
          <span id="currTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <div class="fp-controls">
        <button onclick="toggleShuffle()"><i id="shuffleBtn" class="fas fa-random"></i></button>
        <button onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
        <button class="play-btn-circle" onclick="togglePlay()"><i id="mainPlayIcon" class="fas fa-play"></i></button>
        <button onclick="nextSong()"><i class="fas fa-step-forward"></i></button>
        <button onclick="toggleLoop()"><i id="loopBtn" class="fas fa-redo"></i></button>
      </div>
    </div>
  </div>

  <audio id="audioElement"></audio>

  <script>
    const API_BASE = "https://jiosaavn-api-vxpi.onrender.com";
    const audio = document.getElementById('audioElement');
    let playlist = [];
    let currentIndex = 0;

    async function searchMusic() {
      const q = document.getElementById('query').value.trim();
      const list = document.getElementById('results');
      if (!q) return;
      list.innerHTML = '<p class="status-info">Searching songs...</p>';
      try {
        const res = await fetch(`${API_BASE}/api/search/songs?query=${encodeURIComponent(q)}`);
        const json = await res.json();
        playlist = json.data?.results || json.results || [];
        list.innerHTML = '';
        if (!playlist.length) {
          list.innerHTML = '<p class="status-info">Koi gaana nahi mila!</p>';
          return;
        }
        playlist.forEach((song, i) => {
          const thumb = Array.isArray(song.image) ? (song.image[2]?.url || song.image[1]?.url || song.image[0]?.url) : (song.image || '');
          const artist = Array.isArray(song.artists?.primary) ? song.artists.primary.map(a => a.name).join(', ') : (song.primaryArtists || song.singers || 'JioSaavn');
          const div = document.createElement('div');
          div.className = 'song-item';
          div.onclick = () => loadTrack(i);
          div.innerHTML = `
            <img src="${thumb || 'https://via.placeholder.com/50'}" alt="">
            <div class="song-details">
              <div class="song-title">${song.name || song.title}</div>
              <div class="song-artist">${artist}</div>
            </div>
          `;
          list.appendChild(div);
        });
      } catch (err) {
        list.innerHTML = '<p class="status-info" style="color:#ff5555;">Server response wait kar raha hai, thodi der me dobara search karein.</p>';
      }
    }

    function loadTrack(index) {
      if (!playlist[index]) return;
      currentIndex = index;
      const song = playlist[index];
      const thumb = Array.isArray(song.image) ? (song.image[2]?.url || song.image[1]?.url || song.image[0]?.url) : (song.image || '');
      let streamUrl = Array.isArray(song.downloadUrl) ? (song.downloadUrl[song.downloadUrl.length - 1]?.url || song.downloadUrl[0]?.url) : song.downloadUrl;
      const artist = Array.isArray(song.artists?.primary) ? song.artists.primary.map(a => a.name).join(', ') : (song.primaryArtists || song.singers || 'JioSaavn');
      const title = song.name || song.title;

      document.getElementById('miniThumb').src = thumb;
      document.getElementById('miniTitle').innerText = title;
      document.getElementById('miniArtist').innerText = artist;
      document.getElementById('fpImg').src = thumb;
      document.getElementById('fpTitle').innerText = title;
      document.getElementById('fpArtist').innerText = artist;

      document.getElementById('miniPlayer').style.display = 'flex';
      audio.src = streamUrl;
      audio.play();
      openFullPlayer();
    }

    function togglePlay(e) {
      if (e) e.stopPropagation();
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function nextSong() {
      if (currentIndex < playlist.length - 1) loadTrack(currentIndex + 1);
    }

    function prevSong() {
      if (currentIndex > 0) loadTrack(currentIndex - 1);
    }

    function openFullPlayer() {
      document.getElementById('fullPlayer').style.display = 'flex';
    }

    function closeFullPlayer() {
      document.getElementById('fullPlayer').style.display = 'none';
    }

    audio.onplay = () => {
      document.getElementById('mainPlayIcon').className = 'fas fa-pause';
      document.getElementById('miniPlayIcon').className = 'fas fa-pause';
    };

    audio.onpause = () => {
      document.getElementById('mainPlayIcon').className = 'fas fa-play';
      document.getElementById('miniPlayIcon').className = 'fas fa-play';
    };

    audio.ontimeupdate = () => {
      const seek = document.getElementById('seekSlider');
      const curr = document.getElementById('currTime');
      const total = document.getElementById('totalTime');
      if (audio.duration) {
        seek.value = (audio.currentTime / audio.duration) * 100;
        curr.innerText = formatTime(audio.currentTime);
        total.innerText = formatTime(audio.duration);
      }
    };

    audio.onended = () => nextSong();

    function seekAudio() {
      const seek = document.getElementById('seekSlider');
      audio.currentTime = (seek.value / 100) * audio.duration;
    }

    function formatTime(secs) {
      const min = Math.floor(secs / 60);
      const sec = Math.floor(secs % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function toggleLoop() {
      audio.loop = !audio.loop;
      document.getElementById('loopBtn').classList.toggle('active', audio.loop);
    }

    function toggleShuffle() {
      document.getElementById('shuffleBtn').classList.toggle('active');
    }
  </script>
</body>
</html>
